  docs commit exists) — forbidden by the loop's own SOP.
- 'Adding tests to already-covered code: coverage is ~99% statements / ~96% branches;
  new tests only for a demonstrated uncovered branch, never to inflate numbers.'
- 'Cosmetic sweeps with no behavior change: Prettier reformat batches (one already
  landed), import re-ordering, sprinkling React.memo/useCallback on stable components.'
