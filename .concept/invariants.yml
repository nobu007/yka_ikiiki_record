    severity: CRITICAL
    description: CSV export must escape commas, quotes, and newlines per RFC 4180
    constraint: "Fields containing commas or newlines are wrapped in double quotes; quotes within fields are escaped as double quotes (\"\")"
    validation: "export/route.csv.test.ts verifies comma, quote, and newline escaping"
    rationale: "Prevents CSV parsing errors and follows RFC 4180 standard"
    related_terms: ["Record"]
    status: "stable"
    strength: "hard"

  - id: INV-API-010
    name: Export_Response_Headers
    category: api
    severity: CRITICAL
    description: CSV export must set Content-Type and Content-Disposition headers with a unique timestamped filename
    constraint: "Content-Type is 'text/csv; charset=utf-8'; Content-Disposition matches 'attachment; filename=\"records-{timestamp}.csv\"'; each request generates a unique timestamp"
    validation: "export/route.headers.test.ts verifies header formats and filename uniqueness"
    rationale: "Ensures proper CSV MIME type and triggers browser download without filename collisions"
    related_terms: ["Record"]
    status: "stable"
    strength: "hard"

  - id: INV-API-012
    name: Metrics_Response_Structure
    category: api
    severity: CRITICAL
    description: GET /api/metrics must return timestamp, judgment, and system properties
    constraint: "Response JSON contains timestamp, judgment{}, system{}"
    validation: "metrics/route.test.ts verifies response structure"
    rationale: "Ensures monitoring dashboard receives complete metrics"
    related_terms: []
    status: "stable"
    strength: "hard"

  - id: INV-API-013
    name: Metrics_Memory_Usage_Bounds
    category: api
    severity: CRITICAL
    description: Memory metrics must have heapUsed <= heapTotal and usagePercentage in [0, 100]
    constraint: "heapUsed <= heapTotal, 0 <= usagePercentage <= 100"
    validation: "metrics/route.test.ts verifies memory bounds"
    rationale: "Prevents invalid memory metrics from causing display errors"
    related_terms: []
    status: "stable"
    strength: "hard"

  # INFRASTRUCTURE INVARIANTS (EXTRACTED FROM TESTS)
  - id: INV-INF-001
    name: Repository_Factory_Config_Contract
    category: infrastructure
    severity: CRITICAL
    description: Repository factory must resolve provider configuration deterministically and fail fast on errors
    constraint: "Missing DATABASE_PROVIDER defaults to MockStatsRepository; DATABASE_PROVIDER=prisma requires DATABASE_URL to be set; invalid DATABASE_PROVIDER values throw error"
    validation: "repositoryFactory.test.ts verifies default provider, Prisma validation, and invalid provider rejection"
    rationale: "Ensures test environments work without configuration and prevents runtime errors from misconfiguration"
    related_terms: ["StatsRepository", "MockStatsRepository", "PrismaStatsRepository"]
    status: "stable"
    strength: "hard"

  # HOOK INVARIANTS (EXTRACTED FROM TESTS)
  - id: INV-HOOK-001
    name: useAsync_Contract
    category: hook
    severity: HIGH
    description: useAsync hook must initialize correctly, transition through loading states, and capture errors
    constraint: "Initial state is isLoading=false, error=null, data=null; isLoading true during execution and false after completion; on error data=null and error set"
    validation: "useAsync.test.ts verifies initial state, transitions, and error handling"
    rationale: "Ensures predictable hook lifecycle and accurate loading/error state tracking"
    related_terms: ["useAsync", "AppError"]
    status: "stable"
    strength: "hard"

  - id: INV-HOOK-004
    name: useNotification_Contract
    category: hook
    severity: MEDIUM
    description: useNotification hook must initialize with default state and support all notification types
    constraint: "Initial state is show=false, message='', type='success'; supports success, error, warning, info types"
    validation: "useNotification.test.ts verifies initial state and all notification types"
    rationale: "Ensures predictable notification behavior"
    related_terms: ["useNotification"]
    status: "stable"
    strength: "soft"

  # GENERATION INVARIANTS (EMOTION PATTERN HANDLING)
  - id: INV-GEN-004
    name: EmotionGenerator_Effects_Application
    category: generation
    severity: MEDIUM
    description: EmotionGenerator must apply seasonal, event, and class-characteristic effects when configured
    constraint: "When seasonalEffects=true, adjust emotion based on date; adjust emotion when date is within event start/end range; use classCharacteristics.volatility and baselineEmotion in generation"
    validation: "EmotionGenerator.test.ts verifies seasonal/event effects and class characteristics"
    rationale: "Enables realistic emotion variation for seasons, events, and class dynamics"
    related_terms: ["EmotionGenerator", "DataGenerationConfig"]
    status: "stable"
    strength: "soft"

  # SERVICE LAYER INVARIANTS
  - id: INV-SVC-002
    name: StatsService_Defaults_Contract
    category: service
    severity: HIGH
    description: StatsService and DataGenerationConfig must work without explicit configuration
    constraint: "generateSeedData() must work without config parameter; all optional DataGenerationConfig fields must have default values"
    validation: "StatsService.test.ts and DataGeneration.defaults.test.ts verify default usage"
    rationale: "Ensures service and config can be used without explicit values"
    related_terms: ["StatsService", "DataGenerationConfig"]
    status: "stable"
    strength: "hard"

violation_handling:
  critical:
    action: "BLOCK_COMMIT"
    message: "CRITICAL INVARIANT VIOLATION - Fix required before commit"
  high:
    action: "WARN_REQUIRE_FIX"
    message: "HIGH SEVERITY VIOLATION - Fix strongly recommended"
  medium:
    action: "LOG_WARN"
    message: "MEDIUM SEVERITY VIOLATION - Address in next iteration"

monitoring:
  automated_checks:
    - name: typescript_strict_check
      command: "npx tsc --noEmit --strict 2>&1 | grep -c 'error TS'"
      threshold: 0
      note: "INV-QUAL-001: TypeScript strict mode compliance"
    - name: date_filename_check
      command: "find . -name '*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]*' | wc -l"
      threshold: 0
      note: "INV-QUAL-002: No timestamped filenames"
    - name: inv_arch_001_srp_check
      command: "find src -name '*.tsx' -o -name '*.ts' | xargs wc -l | sort -rn | head -1 | awk '{print ($1 > 300) ? 1 : 0}'"
      threshold: 0
      note: "INV-ARCH-001: ALL files including test files must be < 300 lines"
