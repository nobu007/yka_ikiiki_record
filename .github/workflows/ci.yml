name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 16 requires Node.js >= 20.9.0
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false # 後で実行する

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .npmrc has ignore-scripts=true (ansible-managed), so the package.json
      # postinstall (prisma generate) never runs during install; generate the
      # client explicitly or prisma/seed.ts fails typecheck in `next build`.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e
