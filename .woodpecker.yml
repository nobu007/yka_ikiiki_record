# Canonical PR checks: self-hosted, documentation/CI policy has a bounded lane.
# Application changes retain build, lint, existing unit and browser checks.
when:
  - event: [pull_request, manual]
labels:
  platform: linux/amd64
steps:
  - name: ci
    image: node:22-bookworm-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git python3 python3-yaml
      - bash scripts/ci/check.sh
